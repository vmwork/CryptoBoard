# docker-compose.local.yml
services:
  dev_frontend:
    command: npm run dev -- --host 0.0.0.0 --port 3000
    volumes:
      - ./frontend:/app
      - classifyd_dev_frontend_node_modules:/app/node_modules
      - classifyd_dev_frontend_nuxt:/app/.nuxt
    environment:
      - NITRO_PORT=3000
      - NITRO_HOST=0.0.0.0
      - NUXT_API_BASE=http://classifyd_dev_api:8000
      - NUXT_PUBLIC_API_BASE=
    ports:
      - "3000:3000"
      - "24678:24678"

  dev_backend:
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - POSTGRES_SERVER=dev_postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${CLASSIFYD_DEV_POSTGRES_DB:-classifyd_dev_db}
      - REDIS_URL=redis://classifyd_dev_cache:6379
      - SECRET_KEY=${SECRET_KEY}

volumes:
  classifyd_dev_frontend_node_modules:
  classifyd_dev_frontend_nuxt:
