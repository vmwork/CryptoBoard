name: classifyd-dev

services:
  dev_postgres:
    image: postgres:15-alpine
    container_name: classifyd_dev_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${CLASSIFYD_DEV_POSTGRES_DB:-classifyd_dev_db}
    expose:
      - "5432"
    volumes:
      - classifyd_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - classifyd_network

  dev_dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: classifyd_dev_cache
    expose:
      - "6379"
    volumes:
      - classifyd_dev_dragonfly_data:/data
    environment:
      - HEALTHCHECK_PORT=6379
    networks:
      - classifyd_network
    healthcheck:
      test: [ "CMD-SHELL", "/usr/local/bin/healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 5

  dev_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classifyd_dev_api
    # ⚡ СТЕЙДЖ: строго 1 воркер для экономии ресурсов
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1
    expose:
      - "8000"
    volumes:
      - ./backend:/app/backend
    environment:
      - PYTHONPATH=/app
      - POSTGRES_SERVER=dev_postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${CLASSIFYD_DEV_POSTGRES_DB:-classifyd_dev_db}
      - REDIS_URL=redis://classifyd_dev_cache:6379
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - INTERNAL_BFF_SECRET=${INTERNAL_BFF_SECRET:?INTERNAL_BFF_SECRET is required}
      - EVM_RPC_URL=${EVM_RPC_URL:?EVM_RPC_URL is required}
      - EVM_CHAIN_ID=${EVM_CHAIN_ID:-42161}
      - SIWE_DOMAIN=${SIWE_DOMAIN:-localhost}
      - SIWE_URI=${SIWE_URI:-http://localhost}
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-session_id}
      - NONCE_TTL_SECONDS=${NONCE_TTL_SECONDS:-300}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-604800}
    depends_on:
      dev_postgres:
        condition: service_healthy
      dev_dragonfly:
        condition: service_healthy
    networks:
      classifyd_network:
        aliases:
          - dev_backend

  dev_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: classifyd_dev_frontend
    ports:
      - "3000:3000"
    expose:
      - "3000"
    environment:
      - NITRO_PORT=3000
      - NITRO_HOST=0.0.0.0
      - NUXT_API_BASE=http://classifyd_dev_api:8000
      - NUXT_PUBLIC_API_BASE=http://dev.localhost
      - NUXT_INTERNAL_BFF_SECRET=${INTERNAL_BFF_SECRET:?INTERNAL_BFF_SECRET is required}
      - NUXT_SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-session_id}
      - NUXT_PUBLIC_SITE_URL=http://dev.localhost
      - SITE_URL=http://dev.localhost
      - SITE_INDEXABLE=false
    depends_on:
      - dev_backend
    networks:
      classifyd_network:
        aliases:
          - dev_frontend

volumes:
  classifyd_dev_postgres_data:
  classifyd_dev_dragonfly_data:
  classifyd_dev_frontend_node_modules:
  classifyd_dev_frontend_nuxt:

networks:
  classifyd_network:
    name: classifyd_network
    external: true
