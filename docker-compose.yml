services:
  postgres:
    image: postgres:15-alpine
    container_name: classifyd_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-classifyd_db}
    expose:
      - "5432"
    volumes:
      - classifyd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - classifyd_network

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: classifyd_cache
    expose:
      - "6379"
    volumes:
      - classifyd_dragonfly_data:/data
    environment:
      - HEALTHCHECK_PORT=6379
    networks:
      - classifyd_network
    healthcheck:
      test: [ "CMD-SHELL", "/usr/local/bin/healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classifyd_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    expose:
      - "8000"
    volumes:
      - ./backend:/app/backend
    environment:
      - PYTHONPATH=/app
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-classifyd_db}
      - REDIS_URL=redis://classifyd_cache:6379
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - INTERNAL_BFF_SECRET=${INTERNAL_BFF_SECRET:?INTERNAL_BFF_SECRET is required}
      - EVM_RPC_URL=${EVM_RPC_URL:?EVM_RPC_URL is required}
      - EVM_CHAIN_ID=${EVM_CHAIN_ID:-42161}
      - SIWE_DOMAIN=${SIWE_DOMAIN:?SIWE_DOMAIN is required}
      - SIWE_URI=${SIWE_URI:?SIWE_URI is required}
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-session_id}
      - NONCE_TTL_SECONDS=${NONCE_TTL_SECONDS:-300}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-604800}
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    networks:
      - classifyd_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: classifyd_frontend
    expose:
      - "3000"
    environment:
      - NITRO_PORT=3000
      - NITRO_HOST=0.0.0.0
      - NUXT_API_BASE=http://classifyd_api:8000
      - NUXT_PUBLIC_API_BASE=http://localhost
      - NUXT_INTERNAL_BFF_SECRET=${INTERNAL_BFF_SECRET:?INTERNAL_BFF_SECRET is required}
      - NUXT_SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-session_id}
    depends_on:
      - backend
    networks:
      - classifyd_network

  caddy:
    image: caddy:2-alpine
    container_name: classifyd_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - classifyd_caddy_data:/data
      - classifyd_caddy_config:/config
    depends_on:
      - frontend
    networks:
      - classifyd_network

volumes:
  classifyd_postgres_data:
  classifyd_dragonfly_data:
  classifyd_caddy_data:
  classifyd_caddy_config:

networks:
  classifyd_network:
    name: classifyd_network
    driver: bridge
